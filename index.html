/* ============================== HELPERS ============================== */

function dOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

function nthWeekdayOfMonth(year, month, weekday, n) {
  let d = new Date(year, month, 1);
  let count = 0;
  while (d.getMonth() === month) {
    if (d.getDay() === weekday) {
      count++;
      if (count === n) return new Date(d);
    }
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function lastWeekdayOfMonth(year, month, weekday) {
  let d = new Date(year, month + 1, 0);
  while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
  return new Date(d);
}

function occurrenceInMonth(entry, year, month) {
  const wd = WEEKDAYS.indexOf(entry.weekday);
  if (entry.week === "ultimo") return lastWeekdayOfMonth(year, month, wd);
  return nthWeekdayOfMonth(year, month, wd, parseInt(entry.week, 10));
}

function nextOccurrence(entry, fromDate, strictlyAfter) {
  let y = fromDate.getFullYear(), m = fromDate.getMonth();
  const fromT = dOnly(fromDate);
  for (let i = 0; i < 15; i++) {
    const d = occurrenceInMonth(entry, y, m);
    if (d) {
      const t = dOnly(d);
      if (strictlyAfter ? t > fromT : t >= fromT) return d;
    }
    m++; if (m > 11) { m = 0; y++; }
  }
  return null;
}

function fmtDateShort(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
}
function fmtDateFull(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
}
function todayKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function wazeSearchUrl(house, override) {
  if (override && override.confirmado && override.lat && override.lng) {
    return `https://waze.com/ul?ll=${override.lat}%2C${override.lng}&navigate=yes`;
  }
  if (override && override.confirmado && override.endereco) {
    return `https://waze.com/ul?q=${encodeURIComponent(override.endereco + ", São Paulo")}&navigate=yes`;
  }
  return `https://waze.com/ul?q=${encodeURIComponent(house.name + " Setor Jaraguá São Paulo")}`;
}

function pad(n) { return String(n).padStart(2, "0"); }
function fmtICSLocal(d) {
  return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
}
function fmtICSUTC(d) {
  return d.toISOString().replace(/[-:]/g, "").split(".")[0] + "Z";
}
function buildICS(house, entry) {
  const now = new Date();
  const wdIndex = WEEKDAYS.indexOf(entry.weekday);
  const icsDay = ["SU", "MO", "TU", "WE", "TH", "FR", "SA"][wdIndex];
  const byday = (entry.week === "ultimo" ? "-1" : entry.week) + icsDay;
  const [hh, mm] = entry.time.split(":").map(Number);
  const firstOcc = nextOccurrence(entry, now, false) || occurrenceInMonth(entry, now.getFullYear(), now.getMonth());
  const start = new Date(firstOcc.getFullYear(), firstOcc.getMonth(), firstOcc.getDate(), hh, mm);
  const end = new Date(start.getTime() + 90 * 60000);
  const uid = `${entry.id}-${house.id}@calendario-musical-jaragua`;
  return [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Calendario Musical Setor Jaragua//PT-BR",
    "CALSCALE:GREGORIAN",
    "BEGIN:VEVENT",
    `UID:${uid}`,
    `DTSTAMP:${fmtICSUTC(now)}`,
    `DTSTART:${fmtICSLocal(start)}`,
    `DTEND:${fmtICSLocal(end)}`,
    `RRULE:FREQ=MONTHLY;BYDAY=${byday}`,
    `SUMMARY:Ensaio Musical — ${house.name}`,
    `DESCRIPTION:Encarregado: ${entry.person}\\nCalendário Musical — Setor Jaraguá`,
    `LOCATION:${house.name} — Setor Jaraguá`,
    "BEGIN:VALARM",
    "TRIGGER:-PT1H",
    "ACTION:DISPLAY",
    "DESCRIPTION:Ensaio em 1 hora",
    "END:VALARM",
    "END:VEVENT",
    "END:VCALENDAR",
  ].join("\r\n");
}
function addToDeviceCalendar(house, entry) {
  try {
    const ics = buildICS(house, entry);
    const blob = new Blob([ics], { type: "text/calendar;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `ensaio-${house.id}.ics`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 4000);
  } catch (e) {
    console.error("ICS export failed", e);
    alert("Não foi possível gerar o evento. Tente novamente.");
  }
}

function shareText(house, entry, date) {
  return `🎵 CALENDÁRIO MUSICAL — SETOR JARAGUÁ\n\n📍 ${house.name}\n📅 ${WEEK_LABEL[entry.week]} ${WD_LABEL[entry.weekday].toLowerCase()}${date ? " (" + fmtDateShort(date) + ")" : ""}\n🕐 ${entry.time}\n👤 ${entry.person}\n\n🚗 Como chegar pelo Waze: ${wazeSearchUrl(house)}`;
}

async function doShare(text, title) {
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { /* cancelled */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    alert("Texto copiado! Cole no WhatsApp para compartilhar.");
  } catch (e) {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }
}

/* ============================== STORAGE HOOK ============================== */

function useStored(key, initial, shared) {
  const [value, setValue] = useState(initial);
  const [ready, setReady] = useState(false);

  useEffect(() => {
    let live = true;
    (async () => {
      try {
        if (shared) {
          const res = await fetch(`/api/data?key=${encodeURIComponent(key)}`);
          if (res.ok) {
            const json = await res.json();
            if (live && json !== null && json !== undefined) setValue(json);
          }
        } else {
          const raw = window.localStorage.getItem(key);
          if (live && raw) setValue(JSON.parse(raw));
        }
      } catch (e) { /* keep initial, e.g. offline or key not found yet */ }
      if (live) setReady(true);
    })();
    return () => { live = false; };
    // eslint-disable-next-line
  }, [key]);

  const save = async (next) => {
    setValue(next);
    try {
      if (shared) {
        await fetch(`/api/data?key=${encodeURIComponent(key)}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(next),
        });
      } else {
        window.localStorage.setItem(key, JSON.stringify(next));
      }
    } catch (e) { console.error("storage set failed", e); }
  };
  return [value, save, ready];
}

  const todays = useMemo(() => {
    return scheduleMerged.filter(e => {
      const d = occurrenceInMonth(e, today.getFullYear(), today.getMonth());
      return d && dOnly(d) === dOnly(today);
    });
  }, [scheduleMerged, today]);

  const upcoming = useMemo(() => {
    const list = scheduleMerged.map(e => ({ entry: e, date: nextOccurrence(e, today, true) })).filter(x => x.date);
    list.sort((a, b) => a.date - b.date);
    return list.slice(0, 8);
  }, [scheduleMerged, today]);

  const upcomingGrouped = useMemo(() => {
    const groups = [];
    upcoming.forEach((item) => {
      const last = groups[groups.length - 1];
      if (last && dOnly(last.date) === dOnly(item.date)) {
        last.items.push(item);
      } else {
        groups.push({ date: item.date, items: [item] });
      }
    });
    return groups;
  }, [upcoming]);

  const searchResults = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return null;
    return scheduleMerged
      .map((entry) => {
        const house = HOUSES.find((h) => h.id === entry.houseId);
        return { entry, house, date: nextOccurrence(entry, today, false) };
      })
      .filter(({ entry, house }) => {
        const hay = [house.name, entry.person, WD_LABEL[entry.weekday], WEEK_LABEL[entry.week], entry.time].join(" ").toLowerCase();
        return hay.includes(q);

            <div className="space-y-2.5">
              {searchResults.map(({ entry, house, date }) => (

      {showWelcome && (

          <button
            onClick={() => doShare("🎵 CALENDÁRIO MUSICAL — SETOR JARAGUÁ\n\nDeus abençoe! Estou usando este app para acompanhar os ensaios musicais das Casas de Oração do nosso Setor. Acesse e adicione à tela inicial do seu celular:\n" + window.location.origin + window.location.pathname, "Calendário Musical — Setor Jaraguá")}

function CalendarioPage({ ensaiosOverrides, favorites, toggleFav, casasOverrides, openHouse }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [selDay, setSelDay] = useState(new Date());
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const monthEvents = useMemo(() => {
    const map = {};
    scheduleMerged.forEach(e => {
      const d = occurrenceInMonth(e, year, month);
      if (d) {
        const k = d.getDate();
        if (!map[k]) map[k] = [];
        map[k].push(e);
      }
    });
    return map;
  }, [scheduleMerged, year, month]);

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selEvents = selDay.getMonth() === month && selDay.getFullYear() === year ? (monthEvents[selDay.getDate()] || []) : [];
  const today = new Date();

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={CalendarIcon}>Calendário</SectionTitle>
      <div className="bg-white rounded-2xl border border-slate-200 p-3 shadow-sm">
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="p-2 rounded-full bg-slate-100"><ChevronLeft size={18} /></button>
          <p className="font-serif font-semibold text-slate-900 capitalize">{cursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</p>
          <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="p-2 rounded-full bg-slate-100"><ChevronRight size={18} /></button>
        </div>
        <button onClick={() => { setCursor(new Date(today.getFullYear(), today.getMonth(), 1)); setSelDay(today); }} className="text-xs text-blue-700 font-semibold mb-2">Hoje</button>
        <div className="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-400 mb-1">
          {["D","S","T","Q","Q","S","S"].map((d,i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const evs = monthEvents[d] || [];
            const isToday = dOnly(new Date(year, month, d)) === dOnly(today);
            const isSel = selDay.getDate() === d && selDay.getMonth() === month && selDay.getFullYear() === year;
            return (
              <button key={i} onClick={() => setSelDay(new Date(year, month, d))}
                className={`aspect-square rounded-lg flex flex-col items-center justify-center text-sm relative
                  ${isSel ? "bg-blue-700 text-white font-bold" : isToday ? "bg-amber-100 text-blue-900 font-bold" : "text-slate-700 hover:bg-slate-50"}`}>
                {d}
                {evs.length > 0 && (
                  <div className="flex gap-0.5 mt-0.5">
                    {evs.slice(0, 3).map((e, j) => <span key={j} className={`w-1.5 h-1.5 rounded-full ${isSel ? "bg-white" : WD_STYLE[e.weekday].dot}`} />)}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="mt-5">
        <p className="font-semibold text-slate-800 mb-2">{fmtDateFull(selDay)}</p>
        {selEvents.length === 0 ? (
          <EmptyState icon={CalendarIcon} title="Sem ensaios neste dia" />
        ) : (
          <div className="space-y-2.5">
            {selEvents.map(e => {
              const house = HOUSES.find(h => h.id === e.houseId);
              return <EnsaioCard key={e.id} house={house} entry={e} date={selDay} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />;
            })}
          </div>
        )}
      </div>
    </div>
  );
}

function CasasPage({ favorites, toggleFav, casasOverrides, ensaiosOverrides, openHouse }) {
  const [q, setQ] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [fWeekday, setFWeekday] = useState("");
  const [fWeek, setFWeek] = useState("");
  const [fTime, setFTime] = useState("");
  const [onlyFav, setOnlyFav] = useState(false);

  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);

  const rows = useMemo(() => {
    return HOUSES.map(h => ({ house: h, entry: scheduleMerged.find(e => e.houseId === h.id) })).filter(r => {
      const ov = casasOverrides[r.house.id];
      if (ov && ov.ativo === false) return false;
      if (onlyFav && !favorites.includes(r.house.id)) return false;
      if (fWeekday && (!r.entry || r.entry.weekday !== fWeekday)) return false;
      if (fWeek && (!r.entry || r.entry.week !== fWeek)) return false;
      if (fTime && (!r.entry || r.entry.time !== fTime)) return false;
      if (q.trim()) {
        const s = q.toLowerCase();
        const hay = [r.house.name, r.entry?.person, r.entry ? WD_LABEL[r.entry.weekday] : "", r.entry ? WEEK_LABEL[r.entry.week] : "", r.entry?.time].join(" ").toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }, [q, fWeekday, fWeek, fTime, onlyFav, favorites, casasOverrides, scheduleMerged]);

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={MapPin}>Casas de Oração</SectionTitle>
      <div className="flex gap-2 mb-3">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar Casa, bairro, encarregado, horário..."
            className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700" />
        </div>
        <button onClick={() => setShowFilters(s => !s)} className={`p-2.5 rounded-xl border ${showFilters ? "bg-blue-700 text-white border-blue-700" : "bg-white text-slate-600 border-slate-200"}`}><Filter size={18} /></button>
      </div>

      {showFilters && (
        <div className="bg-slate-50 rounded-xl p-3 mb-3 space-y-3 border border-slate-200">
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Dia</p>
            <div className="flex gap-1.5 flex-wrap">
              {["sexta","sabado","domingo"].map(w => (
                <button key={w} onClick={() => setFWeekday(fWeekday === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fWeekday === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{WD_LABEL[w]}</button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Semana</p>
            <div className="flex gap-1.5 flex-wrap">
              {["1","2","3","4","ultimo"].map(w => (
                <button key={w} onClick={() => setFWeek(fWeek === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fWeek === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{WEEK_LABEL[w]}</button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Horário</p>
            <div className="flex gap-1.5 flex-wrap">
              {["16:00","16:30","17:00","19:30"].map(w => (
                <button key={w} onClick={() => setFTime(fTime === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fTime === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{w}</button>
              ))}
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input type="checkbox" checked={onlyFav} onChange={e => setOnlyFav(e.target.checked)} className="w-4 h-4 accent-blue-700" /> Somente favoritos
          </label>
        </div>
      )}

      <p className="text-xs text-slate-400 mb-2">{rows.length} de {HOUSES.length} Casas</p>
      <div className="space-y-2.5">
        {rows.length === 0 && <EmptyState icon={Search} title="Nenhuma Casa encontrada" subtitle="Tente outro termo ou remova os filtros." />}
        {rows.map(({ house, entry }) => entry && (
          <EnsaioCard key={house.id} house={house} entry={entry} date={null} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />
        ))}
      </div>
    </div>
  );
}

/* ============================== CASA DETAIL ============================== */

function CasaDetailPage({ houseId, favorites, toggleFav, casasOverrides, ensaiosOverrides, back }) {
  const house = HOUSES.find(h => h.id === houseId);
  const ov = casasOverrides[houseId] || {};
  const entry = useMemo(() => {
    const base = SCHEDULE.find(e => e.houseId === houseId);
    return base ? { ...base, ...(ensaiosOverrides[base.id] || {}) } : null;
  }, [houseId, ensaiosOverrides]);
  const isFav = favorites.includes(houseId);

  const nextDates = useMemo(() => {
    if (!entry) return [];
    const list = [];
    let from = new Date();
    for (let i = 0; i < 4; i++) {
      const d = nextOccurrence(entry, from, i > 0);
      if (!d) break;
      list.push(d);
      from = new Date(d.getTime() + 86400000);
    }
    return list;
  }, [entry]);

  if (!house) return null;

  return (
    <div className="pb-6">
      <div className="relative">
        <HousePhoto url={ov.photo} className="w-full h-56" />
        <button onClick={back} className="absolute top-4 left-4 p-2 rounded-full bg-black/40 text-white backdrop-blur"><ArrowLeft size={20} /></button>
        <div className="absolute top-4 right-4"><FavButton active={isFav} onToggle={() => toggleFav(houseId)} size={20} /></div>
      </div>
      <div className="px-4 pt-4 space-y-5">
        <h1 className="font-serif text-2xl font-bold text-slate-900">{house.name}</h1>

        {entry && (
          <div className={`rounded-2xl p-4 border ${WD_STYLE[entry.weekday].border} ${WD_STYLE[entry.weekday].bg}`}>
            <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Próximo ensaio</p>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div>
                <CalendarIcon size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800">{WEEK_LABEL[entry.week]} {WD_SHORT[entry.weekday]}</p>
              </div>
              <div>
                <Clock size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800">{entry.time}</p>
              </div>
              <div>
                <User size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800 truncate">{entry.person}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3">
              <IconBtn icon={CalendarPlus} label="Adicionar à agenda" tone="green" onClick={() => addToDeviceCalendar(house, entry)} />
              <IconBtn icon={Share2} label="Compartilhar" tone="slate" onClick={() => doShare(shareText(house, entry, nextDates[0]), "Calendário Musical")} />
            </div>
          </div>
        )}

        <div>
          <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2 flex items-center gap-1.5"><MapPin size={13} /> Localização</p>
          {ov.confirmado ? (
            <div className="rounded-xl border border-slate-200 p-3">
              <p className="text-sm text-slate-700">{ov.endereco}</p>
              {ov.bairro && <p className="text-xs text-slate-400 mt-0.5">{ov.bairro}{ov.cidade ? " · " + ov.cidade : ""}</p>}
            </div>
          ) : (
            <div className="rounded-xl border border-dashed border-slate-300 p-3 flex items-center gap-2 text-slate-500 text-sm">
              <AlertCircle size={16} className="shrink-0" /> Endereço em confirmação — informação em atualização.
            </div>
          )}
          <div className="grid grid-cols-2 gap-2 mt-3">
            <a href={wazeSearchUrl(house, ov)} target="_blank" rel="noreferrer"
              className="flex items-center justify-center gap-2 bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm"><Navigation size={17} /> {ov.confirmado ? "Abrir no Waze" : "Pesquisar no Waze"}</a>
            <button className="flex items-center justify-center gap-2 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl text-sm"><MapPin size={17} /> Ver no mapa</button>
          </div>
        </div>

        <div>
          <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2 flex items-center gap-1.5"><CalendarIcon size={13} /> Calendário</p>
          <div className="space-y-2">
            {nextDates.map((d, i) => (
              <div key={i} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                <span className="text-sm font-medium text-slate-700">{fmtDateFull(d)}</span>
                <span className="text-sm font-bold text-blue-700">{entry.time}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function FavoritosPage({ favorites, toggleFav, casasOverrides, ensaiosOverrides, openHouse, setView }) {
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);
  const favEntries = useMemo(() => {
    const list = favorites.map(hid => {
      const entry = scheduleMerged.find(e => e.houseId === hid);
      if (!entry) return null;
      return { house: HOUSES.find(h => h.id === hid), entry, date: nextOccurrence(entry, new Date(), false) };
    }).filter(Boolean);
    list.sort((a, b) => a.date - b.date);
    return list;
  }, [favorites, scheduleMerged]);

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={Heart} accent="bg-rose-500">❤️ Meus Favoritos</SectionTitle>
      {favEntries.length === 0 ? (
        <EmptyState icon={Heart} title="Você ainda não tem favoritos" subtitle="Toque no coração de uma Casa para adicioná-la aqui." />
      ) : (
        <>
          <div className="bg-rose-50 border border-rose-100 rounded-xl p-3 mb-4">
            <p className="text-xs font-bold uppercase text-rose-500 mb-1.5">Próximo ensaio dos seus favoritos</p>
            {favEntries.slice(0, 3).map(f => (
              <p key={f.house.id} className="text-sm text-slate-700"><span className="font-semibold">{f.house.name}</span> — {WD_LABEL[f.entry.weekday]} • {f.entry.time}</p>
            ))}
          </div>
          <div className="space-y-2.5">
            {favEntries.map(f => (
              <EnsaioCard key={f.house.id} house={f.house} entry={f.entry} date={f.date} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[f.house.id]} onOpen={openHouse} />

}

function AgendaPage({ favorites, ensaiosOverrides, casasOverrides, favToggle, openHouse }) {
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);
  const grouped = useMemo(() => {
    const g = { sexta: [], sabado: [], domingo: [] };
    favorites.forEach(hid => {
      const entry = scheduleMerged.find(e => e.houseId === hid);
      if (entry) g[entry.weekday].push({ house: HOUSES.find(h => h.id === hid), entry });
    });
    Object.keys(g).forEach(k => g[k].sort((a, b) => a.entry.time.localeCompare(b.entry.time)));
    return g;
  }, [favorites, scheduleMerged]);

  const order = ["sexta", "sabado", "domingo"];
  const any = favorites.length > 0;

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={CalendarPlus} accent="bg-emerald-600">❤️ Minha Agenda</SectionTitle>
      {!any ? (
        <EmptyState icon={CalendarPlus} title="Adicione favoritos para montar sua agenda" />
      ) : (
        <div className="space-y-5">
          {order.filter(k => grouped[k].length).map(k => (
            <div key={k}>
              <p className={`font-serif font-bold text-sm uppercase tracking-wide mb-2 ${WD_STYLE[k].text}`}>{WD_LABEL[k]}</p>
              <div className="space-y-2">
                {grouped[k].map(({ house, entry }) => (
                  <button key={house.id} onClick={() => openHouse(house.id)} className={`w-full flex items-center justify-between rounded-xl border ${WD_STYLE[k].border} ${WD_STYLE[k].bg} px-3.5 py-2.5`}>
                    <span className="text-sm font-semibold text-slate-800">{entry.time} — {house.name}</span>
                    <ChevronRight size={16} className="text-slate-400" />
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

const CULTO_TIPOS = [
  { id: "batismo", label: "Batismos", icon: "💧" },
  { id: "oficial", label: "Cultos Oficiais", icon: "🏠" },
  { id: "evangelizacao", label: "Cultos de Evangelização", icon: "📣" },
  { id: "mocidade", label: "Cultos de Mocidade", icon: "🧑‍🤝‍🧑" },
  { id: "jovens", label: "Reunião de Jovens e Menores", icon: "🎤" },
  { id: "reuniao_mocidade", label: "Reunião de Mocidade", icon: "🙋" },
];
const DIA_SEMANA_LABEL = { domingo: "Domingo", segunda: "Segunda", terca: "Terça", quarta: "Quarta", quinta: "Quinta", sexta: "Sexta", sabado: "Sábado" };

function CultosPage({ cultos }) {
  const [tab, setTab] = useState("oficial");
  const today = useMemo(() => new Date(), []);
  const todayItems = useMemo(() => {
    const wd = WEEKDAYS[today.getDay()];
    return cultos.filter((c) => c.diaSemana === wd).sort((a, b) => (a.horario || "").localeCompare(b.horario || ""));
  }, [cultos, today]);
  const items = cultos.filter((c) => c.tipo === tab).sort((a, b) => {
    if (a.data && b.data) return a.data.localeCompare(b.data);
    if (a.data) return -1;
    if (b.data) return 1;
    return (a.local || "").localeCompare(b.local || "");
  });

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={ShieldCheck}>Cultos e Reuniões</SectionTitle>

      {todayItems.length > 0 && (
        <div className="mb-5">
          <p className="text-xs font-bold uppercase tracking-wide text-amber-600 mb-2">🔥 Hoje tem culto — {WD_LABEL[WEEKDAYS[today.getDay()]]}</p>
          <div className="space-y-2">
            {todayItems.map((c) => {
              const tipoInfo = CULTO_TIPOS.find((t) => t.id === c.tipo);
              return (
                <div key={c.id} className="rounded-xl bg-amber-50 border border-amber-200 p-3 flex items-center justify-between gap-2">
                  <div className="min-w-0">
                    <p className="font-semibold text-sm text-slate-800 truncate">{c.local}</p>
                    <p className="text-xs text-slate-500">{tipoInfo?.icon} {tipoInfo?.label}</p>
                  </div>
                  <span className="flex items-center gap-1 text-sm font-bold text-blue-700 shrink-0"><Clock size={14} />{c.horario}</span>
                </div>
              );
            })}
          </div>
        </div>
      )}

      <p className="text-[11px] font-bold uppercase tracking-widest text-slate-400 mb-2 px-1">Serviços Oficiais</p>
      <div className="bg-white rounded-xl border border-slate-200 divide-y divide-slate-100 overflow-hidden mb-5">
        {CULTO_TIPOS.map((t) => (
          <button key={t.id} onClick={() => setTab(t.id)}
            className={`w-full flex items-center gap-3 px-3.5 py-3 text-left transition ${tab === t.id ? "bg-blue-700 text-white" : "hover:bg-slate-50 text-slate-700"}`}>
            <span className="text-base w-5 text-center">{t.icon}</span>
            <span className="text-sm font-semibold">{t.label}</span>
          </button>
        ))}
      </div>

      {items.length === 0 ? (
        <EmptyState icon={ShieldCheck} title="Nenhuma informação cadastrada ainda" subtitle="O administrador vai adicionar os dias e horários em breve." />
      ) : (
        <div className="space-y-2.5">
          {items.map((c) => (
            <div key={c.id} className="rounded-2xl border border-slate-200 p-3.5">
              <p className="font-semibold text-slate-900">{c.local}</p>
              <div className="flex items-center gap-2 mt-1.5 flex-wrap text-xs">
                {c.diaSemana && <Badge tone={c.diaSemana === "domingo" ? "domingo" : c.diaSemana === "sabado" ? "sabado" : "sexta"}>{DIA_SEMANA_LABEL[c.diaSemana]}</Badge>}
                {c.data && <Badge tone="sabado">{fmtDateShort(new Date(c.data + "T00:00:00"))}</Badge>}
                {c.horario && <span className="flex items-center gap-1 text-slate-600 font-medium"><Clock size={12} />{c.horario}</span>}
              </div>
              {c.notas && <p className="text-sm text-slate-500 mt-2">{c.notas}</p>}
            </div>
          ))}
        </div>

function resizeImageToDataURL(file, maxWidth) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width, height = img.height;
        if (width > maxWidth) {
          height = Math.round((height * maxWidth) / width);
          width = maxWidth;
        }
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext("2d");
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL("image/jpeg", 0.75));
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function EnviarDocumentoPage({ addSuggestion, setView }) {
  const [titulo, setTitulo] = useState("");
  const [obs, setObs] = useState("");
  const [preview, setPreview] = useState(null);
  const [erro, setErro] = useState("");
  const [sent, setSent] = useState(false);

  const handleFile = async (e) => {
    const file = e.target.files[0];
    if (!file) return;
    setErro("");
    try {
      const dataUrl = await resizeImageToDataURL(file, 1000);
      setPreview(dataUrl);
    } catch (err) {
      console.error(err);
      setErro("Não foi possível ler essa imagem. Tente outra.");
    }
  };

  const submit = () => {
    if (!titulo.trim() || !preview) return;
    addSuggestion({ id: "sg_" + Date.now(), type: "documento", titulo, imagem: preview, obs, status: "pendente", createdAt: new Date().toISOString() });
    setSent(true);
  };

  if (sent) return (
    <div className="px-4 pt-10 text-center">
      <Check size={40} className="mx-auto text-emerald-600 mb-3" />

                      <button onClick={() => saveRegionais(regionais.filter((x) => x.id !== r.id))} className="p-2 rounded-full bg-rose-50 text-rose-500"><Trash2 size={14} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {tab === "cultos" && (
          <div>
            <button onClick={() => setCultoForm({ id: "ct_" + Date.now(), tipo: "oficial", local: "", diaSemana: "", data: "", horario: "", notas: "" })}
              className="w-full py-2.5 rounded-xl bg-blue-700 text-white text-sm font-semibold mb-3 flex items-center justify-center gap-1.5"><Plus size={15} /> Novo culto/reunião</button>
            {cultos.length === 0 && <EmptyState icon={ShieldCheck} title="Nenhum culto ou reunião cadastrado" subtitle="Adicione conforme for recebendo as informações." />}
            <div className="space-y-2">
              {cultos.map((c) => {
                const tipoInfo = CULTO_TIPOS.find((t) => t.id === c.tipo);
                return (
                  <div key={c.id} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                    <div className="min-w-0">
                      <p className="text-sm font-semibold text-slate-800 truncate">{tipoInfo?.icon} {c.local || "Local não definido"}</p>
                      <p className="text-xs text-slate-400">
                        {tipoInfo?.label} · {c.diaSemana ? DIA_SEMANA_LABEL[c.diaSemana] : (c.data ? fmtDateShort(new Date(c.data + "T00:00:00")) : "dia a definir")} · {c.horario || "horário a definir"}
                      </p>
                    </div>
                    <div className="flex gap-1 shrink-0">
                      <button onClick={() => setCultoForm(c)} className="p-2 rounded-full bg-slate-100 text-slate-600"><Pencil size={14} /></button>
                      <button onClick={() => saveCultos(cultos.filter((x) => x.id !== c.id))} className="p-2 rounded-full bg-rose-50 text-rose-500"><Trash2 size={14} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        )}

        {tab === "avisos" && (
          <div>
            <button onClick={() => setAvisoForm({ id: "av_" + Date.now(), title: "", message: "", type: "informacao", startDate: "", endDate: "" })}
              className="w-full py-2.5 rounded-xl bg-blue-700 text-white text-sm font-semibold mb-3 flex items-center justify-center gap-1.5"><Plus size={15} /> Novo aviso</button>
            <div className="space-y-2">
              {avisos.map(a => (
                <div key={a.id} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                  <div className="min-w-0">
                    <p className="text-sm font-semibold text-slate-800 truncate">{a.title}</p>
                    <p className="text-xs text-slate-400 truncate">{a.message}</p>
                  </div>
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => setAvisoForm(a)} className="p-2 rounded-full bg-slate-100 text-slate-600"><Pencil size={14} /></button>
                    <button onClick={() => saveAvisos(avisos.filter(x => x.id !== a.id))} className="p-2 rounded-full bg-rose-50 text-rose-500"><Trash2 size={14} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "historico" && (
          <div className="space-y-2.5">
            {historico.length === 0 && <EmptyState icon={Clock} title="Nenhuma alteração registrada ainda" />}
            {historico.map(h => (
              <div key={h.id} className="rounded-xl border border-slate-200 p-3 text-sm">
                <p className="text-xs text-slate-400">{new Date(h.date).toLocaleString("pt-BR")}</p>
                <p className="font-semibold text-slate-800">{h.houseName} — {h.field}</p>
                <p className="text-slate-500 text-xs">{h.oldValue} → <span className="font-semibold text-slate-700">{h.newValue}</span></p>
              </div>
            ))}
          </div>
        )}
      </div>

      {editHouse && (
        <EditHouseModal
          houseId={editHouse}
          data={casasOverrides[editHouse] || {}}
          onClose={() => setEditHouse(null)}
          onSave={(data) => {
            const h = HOUSES.find(x => x.id === editHouse);
            logHist(h.name, "dados da casa", "—", "atualizado");
            saveCasasOverrides({ ...casasOverrides, [editHouse]: data });
            setEditHouse(null);
          }}
        />
      )}

      {editEntry && (
        <EditEntryModal
          entry={scheduleMerged.find(e => e.id === editEntry)}
          onClose={() => setEditEntry(null)}
          onSave={(data) => {
            const base = SCHEDULE.find(e => e.id === editEntry);
            const h = HOUSES.find(x => x.id === base.houseId);
            logHist(h.name, "horário", base.time, data.time);
            saveEnsaiosOverrides({ ...ensaiosOverrides, [editEntry]: data });
            setEditEntry(null);
          }}
        />
      )}

      {avisoForm && (
        <AvisoModal
          data={avisoForm}
          onClose={() => setAvisoForm(null)}
          onSave={(data) => {
            const exists = avisos.find(a => a.id === data.id);
            saveAvisos(exists ? avisos.map(a => a.id === data.id ? data : a) : [data, ...avisos]);
            setAvisoForm(null);
          }}
        />
      )}

      {regionalForm && (
        <RegionalModal
          data={regionalForm}
          onClose={() => setRegionalForm(null)}
          onSave={(data) => {
            const exists = regionais.find((r) => r.id === data.id);
            const h = HOUSES.find((x) => x.id === data.houseId);
            logHist(h ? h.name : "Ensaio Regional", "ensaio regional", "—", `${data.date || "sem data"} ${data.time || ""}`.trim());
            saveRegionais(exists ? regionais.map((r) => (r.id === data.id ? data : r)) : [...regionais, data]);
            setRegionalForm(null);
          }}
        />
      )}

      {cultoForm && (
        <CultoModal
          data={cultoForm}
          onClose={() => setCultoForm(null)}
          onSave={(data) => {
            const exists = cultos.find((c) => c.id === data.id);
            logHist(data.local || "Culto/Reunião", "culto/reunião", "—", `${data.tipo} ${data.horario || ""}`.trim());
            saveCultos(exists ? cultos.map((c) => (c.id === data.id ? data : c)) : [...cultos, data]);
            setCultoForm(null);
          }}
        />
      )}
    </div>
  );
}

function EditHouseModal({ houseId, data, onClose, onSave }) {
  const [form, setForm] = useState({ photo: data.photo || "", endereco: data.endereco || "", bairro: data.bairro || "", cidade: data.cidade || "São Paulo", cep: data.cep || "", lat: data.lat || "", lng: data.lng || "", confirmado: data.confirmado || false, ativo: data.ativo !== false });
  const house = HOUSES.find(h => h.id === houseId);
  return (
    <Modal title={`Editar: ${house.name}`} onClose={onClose}>
      <Field label="URL da foto (opcional)"><input value={form.photo} onChange={e => setForm({ ...form, photo: e.target.value })} className={inputCls} placeholder="https://..." /></Field>
      <Field label="Endereço"><input value={form.endereco} onChange={e => setForm({ ...form, endereco: e.target.value })} className={inputCls} /></Field>
      <Field label="Bairro"><input value={form.bairro} onChange={e => setForm({ ...form, bairro: e.target.value })} className={inputCls} /></Field>
      <Field label="CEP"><input value={form.cep} onChange={e => setForm({ ...form, cep: e.target.value })} className={inputCls} /></Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Latitude"><input value={form.lat} onChange={e => setForm({ ...form, lat: e.target.value })} className={inputCls} /></Field>
        <Field label="Longitude"><input value={form.lng} onChange={e => setForm({ ...form, lng: e.target.value })} className={inputCls} /></Field>
      </div>
      <label className="flex items-center gap-2 text-sm font-medium text-slate-700 mb-3">
        <input type="checkbox" checked={form.confirmado} onChange={e => setForm({ ...form, confirmado: e.target.checked })} className="w-4 h-4 accent-blue-700" /> Endereço confirmado
      </label>
      <label className="flex items-center gap-2 text-sm font-medium text-slate-700 mb-4">
        <input type="checkbox" checked={form.ativo} onChange={e => setForm({ ...form, ativo: e.target.checked })} className="w-4 h-4 accent-blue-700" /> Casa ativa
      </label>
      <button onClick={() => onSave(form)} className="w-full py-3 rounded-xl bg-blue-700 text-white font-semibold">Salvar</button>
    </Modal>
  );
}

function EditEntryModal({ entry, onClose, onSave }) {
  const [form, setForm] = useState({ time: entry.time, person: entry.person });
  return (
    <Modal title="Editar ensaio" onClose={onClose}>
      <Field label="Horário"><input type="time" value={form.time} onChange={e => setForm({ ...form, time: e.target.value })} className={inputCls} /></Field>
      <Field label="Encarregado"><input value={form.person} onChange={e => setForm({ ...form, person: e.target.value })} className={inputCls} /></Field>
      <button onClick={() => onSave(form)} className="w-full py-3 rounded-xl bg-blue-700 text-white font-semibold">Salvar</button>
    </Modal>
  );
}

function AvisoModal({ data, onClose, onSave }) {
  const [form, setForm] = useState(data);
  return (
    <Modal title="Aviso" onClose={onClose}>
      <Field label="Título"><input value={form.title} onChange={e => setForm({ ...form, title: e.target.value })} className={inputCls} /></Field>
      <Field label="Mensagem"><textarea rows={2} value={form.message} onChange={e => setForm({ ...form, message: e.target.value })} className={inputCls} /></Field>
      <Field label="Tipo">
        <select value={form.type} onChange={e => setForm({ ...form, type: e.target.value })} className={inputCls}>
          <option value="cancelamento">🔴 Cancelamento</option>
          <option value="alteracao">🟡 Alteração</option>
          <option value="informacao">🔵 Informação</option>
          <option value="novidade">🟢 Novidade</option>
        </select>
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Início"><input type="date" value={form.startDate} onChange={e => setForm({ ...form, startDate: e.target.value })} className={inputCls} /></Field>
        <Field label="Fim"><input type="date" value={form.endDate} onChange={e => setForm({ ...form, endDate: e.target.value })} className={inputCls} /></Field>
      </div>
      <button onClick={() => onSave(form)} className="w-full py-3 rounded-xl bg-blue-700 text-white font-semibold mt-1">Salvar aviso</button>
    </Modal>
  );
}

function RegionalModal({ data, onClose, onSave }) {
  const [form, setForm] = useState(data);
  return (
    <Modal title="Ensaio Regional" onClose={onClose}>
      <Field label="Casa de Oração">
        <select value={form.houseId} onChange={(e) => setForm({ ...form, houseId: e.target.value })} className={inputCls}>
          {HOUSES.map((h) => <option key={h.id} value={h.id}>{h.name}</option>)}
        </select>
      </Field>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Data"><input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} className={inputCls} /></Field>
        <Field label="Horário"><input type="time" value={form.time} onChange={(e) => setForm({ ...form, time: e.target.value })} className={inputCls} /></Field>
      </div>
      <Field label="Status">
        <select value={form.status} onChange={(e) => setForm({ ...form, status: e.target.value })} className={inputCls}>
          <option value="agendado">🗓 Agendado</option>
          <option value="realizado">✓ Realizado</option>
          <option value="cancelado">✕ Cancelado</option>
        </select>
      </Field>
      <Field label="Observação (opcional)"><textarea rows={2} value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} className={inputCls} /></Field>
      <button onClick={() => onSave(form)} className="w-full py-3 rounded-xl bg-blue-700 text-white font-semibold mt-1">Salvar ensaio regional</button>
    </Modal>
  );
}

function CultoModal({ data, onClose, onSave }) {
  const [form, setForm] = useState(data);
  return (
    <Modal title="Culto / Reunião" onClose={onClose}>
      <Field label="Tipo">
        <select value={form.tipo} onChange={(e) => setForm({ ...form, tipo: e.target.value })} className={inputCls}>
          {CULTO_TIPOS.map((t) => <option key={t.id} value={t.id}>{t.icon} {t.label}</option>)}
        </select>
      </Field>
      <Field label="Local (Casa de Oração ou Congregação)">
        <input value={form.local} onChange={(e) => setForm({ ...form, local: e.target.value })} className={inputCls} placeholder="Ex: Congregação Freguesia do Ó" />
      </Field>
      <p className="text-xs text-slate-400 -mt-2 mb-3">Preencha "Dia da semana" para algo recorrente (ex: todo domingo), ou "Data específica" para um evento único.</p>
      <div className="grid grid-cols-2 gap-2">
        <Field label="Dia da semana">
          <select value={form.diaSemana} onChange={(e) => setForm({ ...form, diaSemana: e.target.value, data: "" })} className={inputCls}>
            <option value="">—</option>
            {Object.entries(DIA_SEMANA_LABEL).map(([id, label]) => <option key={id} value={id}>{label}</option>)}
          </select>
        </Field>
        <Field label="Data específica">
          <input type="date" value={form.data} onChange={(e) => setForm({ ...form, data: e.target.value, diaSemana: "" })} className={inputCls} />
        </Field>
      </div>
      <Field label="Horário"><input type="time" value={form.horario} onChange={(e) => setForm({ ...form, horario: e.target.value })} className={inputCls} /></Field>
      <Field label="Observação (opcional)"><textarea rows={2} value={form.notas} onChange={(e) => setForm({ ...form, notas: e.target.value })} className={inputCls} /></Field>
      <button onClick={() => onSave(form)} className="w-full py-3 rounded-xl bg-blue-700 text-white font-semibold mt-1">Salvar</button>
    </Modal>
  );
}

/* ============================== APP ROOT ============================== */

function SplashScreen({ onEnter }) {
  return (
    <div
      className="fixed inset-0 z-50 min-h-screen flex flex-col items-center justify-between py-6 px-5 text-center overflow-y-auto no-scrollbar"
      style={{ background: "radial-gradient(circle at 50% 15%, #eef4fb 0%, #f8fafc 55%, #eef1f6 100%)" }}
    >
      <div className="flex-1 flex items-center justify-center w-full py-4">
        <img
          src="/cover.jpg"
          alt="Calendário Musical — Setor Jaraguá"
          className="w-full max-w-md rounded-2xl shadow-xl border border-white/50"
        />
      </div>

      <div className="flex flex-col items-center gap-4 w-full pb-2">
        <button
          onClick={onEnter}
          className="bg-blue-950 hover:bg-blue-900 active:bg-blue-900 text-white text-xs font-bold tracking-[0.2em] px-8 py-3.5 rounded-full flex items-center gap-2 shadow-lg shadow-blue-950/20"
        >
          ACESSAR CALENDÁRIO
          <ArrowLeft size={14} className="rotate-180" />
        </button>
        <p className="text-[10px] tracking-[0.25em] text-slate-400">EDIÇÃO 2026</p>
      </div>
    </div>
  );
}

function App() {
  const [showSplash, setShowSplash] = useState(true);
  const [darkMode, setDarkMode] = useState(false);
  const [view, setView] = useState("home");
  const [houseId, setHouseId] = useState(null);
  const [moreOpen, setMoreOpen] = useState(false);

  const [favorites, saveFavorites, favReady] = useStored("favorites", [], false);
  const [casasOverrides, saveCasasOverrides] = useStored("casas-overrides", SEED_CASAS_OVERRIDES, true);
  const [ensaiosOverrides, saveEnsaiosOverrides] = useStored("ensaios-overrides", {}, true);
  const [suggestions, saveSuggestions] = useStored("suggestions", [], true);
  const [avisos, saveAvisos] = useStored("avisos", [], true);
  const [novidades, saveNovidades] = useStored("novidades", SEED_NOVIDADES, true);
  const [historico, saveHistorico] = useStored("historico", [], true);
  const [regionais, saveRegionais] = useStored("regionais", [], true);
  const [cultos, saveCultos] = useStored("cultos", SEED_CULTOS, true);

  const toggleFav = (hid) => {
    saveFavorites(favorites.includes(hid) ? favorites.filter(x => x !== hid) : [...favorites, hid]);
  };
  const openHouse = (hid) => { setHouseId(hid); setView("casa-detail"); };
  const addSuggestion = (s) => saveSuggestions([...suggestions, s]);

  useEffect(() => { window.scrollTo(0, 0); }, [view, houseId]);

  useEffect(() => {
    try {
      const saved = window.localStorage.getItem("dark-mode");
      if (saved === "1") setDarkMode(true);
    } catch (e) { /* ignore */ }
  }, []);

  useEffect(() => {
    document.documentElement.classList.toggle("dark", darkMode);
    try { window.localStorage.setItem("dark-mode", darkMode ? "1" : "0"); } catch (e) { /* ignore */ }
  }, [darkMode]);

  let content;
  if (!favReady) {
    content = (
      <div className="px-4 pt-4 pb-6 space-y-3 animate-pulse">
        <div className="h-4 w-40 bg-slate-200 rounded" />
        {[0, 1, 2].map((i) => (
          <div key={i} className="rounded-2xl border border-slate-200 p-3.5 flex gap-3 items-center">
            <div className="w-16 h-16 rounded-xl bg-slate-200 shrink-0" />
            <div className="flex-1 space-y-2">
              <div className="h-3.5 w-2/3 bg-slate-200 rounded" />
              <div className="h-3 w-1/3 bg-slate-200 rounded" />
              <div className="h-3 w-1/2 bg-slate-200 rounded" />
            </div>
          </div>
        ))}
      </div>
    );
  } else if (view === "home") content = <HomePage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} avisos={avisos} cultos={cultos} openHouse={openHouse} setView={setView} />;
  else if (view === "calendario") content = <CalendarioPage ensaiosOverrides={ensaiosOverrides} favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} openHouse={openHouse} />;
  else if (view === "casas") content = <CasasPage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} openHouse={openHouse} />;
  else if (view === "casa-detail") content = <CasaDetailPage houseId={houseId} favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} back={() => setView("casas")} />;
  else if (view === "favoritos") content = <FavoritosPage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} openHouse={openHouse} setView={setView} />;
  else if (view === "agenda") content = <AgendaPage favorites={favorites} ensaiosOverrides={ensaiosOverrides} casasOverrides={casasOverrides} favToggle={toggleFav} openHouse={openHouse} />;
  else if (view === "mapa") content = <MapaPage casasOverrides={casasOverrides} favorites={favorites} toggleFav={toggleFav} openHouse={openHouse} />;
  else if (view === "novidades") content = <NovidadesPage novidades={novidades} />;
  else if (view === "avisos") content = <AvisosPage avisos={avisos} />;
  else if (view === "regionais") content = <RegionaisPage regionais={regionais} casasOverrides={casasOverrides} />;
  else if (view === "cultos") content = <CultosPage cultos={cultos} />;
  else if (view === "sugerir-alt") content = <SugerirAlteracaoPage addSuggestion={addSuggestion} setView={setView} />;
  else if (view === "sugerir-ensaio") content = <SugerirEnsaioPage addSuggestion={addSuggestion} setView={setView} />;
  else if (view === "enviar-documento") content = <EnviarDocumentoPage addSuggestion={addSuggestion} setView={setView} />;
  else if (view === "config") content = <ConfiguracoesPage setView={setView} darkMode={darkMode} toggleDark={() => setDarkMode((d) => !d)} />;
  else if (view === "admin") content = <AdminPage casasOverrides={casasOverrides} saveCasasOverrides={saveCasasOverrides} ensaiosOverrides={ensaiosOverrides} saveEnsaiosOverrides={saveEnsaiosOverrides}
    suggestions={suggestions} saveSuggestions={saveSuggestions} avisos={avisos} saveAvisos={saveAvisos} novidades={novidades} saveNovidades={saveNovidades}
    historico={historico} saveHistorico={saveHistorico} favorites={favorites} regionais={regionais} saveRegionais={saveRegionais} cultos={cultos} saveCultos={saveCultos} />;

  return (
    <div className="min-h-screen bg-slate-50 font-sans max-w-md mx-auto relative pb-16 shadow-xl">
      {showSplash && <SplashScreen onEnter={() => setShowSplash(false)} />}
      {view !== "casa-detail" && <Header onMenu={() => setMoreOpen(true)} darkMode={darkMode} toggleDark={() => setDarkMode((d) => !d)} />}
      <main>{content}</main>
      <BottomNav view={view} setView={(v) => { setHouseId(null); setView(v); }} favCount={favorites.length} />
      {moreOpen && <MoreSheet onClose={() => setMoreOpen(false)} setView={setView} hasAvisos={avisos.length > 0} />}
    </div>
  );
}


    const rootEl = document.getElementById("root");
    const root = ReactDOM.createRoot(rootEl);
    root.render(<App />);
  </script>

  <script>
    (function () {
      try {
        var src = document.getElementById("app-source").textContent;
        var out = Babel.transform(src, { presets: [["react", { runtime: "classic" }]] }).code;
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      } catch (err) {
        console.error("Falha ao iniciar o app:", err);
        document.getElementById("fallback").style.display = "block";
      }
    })();
  </script>

  <script>
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", function () {
        navigator.serviceWorker.register("/sw.js").catch(function (e) {
          console.warn("Service worker não registrado:", e);
        });
      });
    }
  </script>
</body>
</html>
