/* ============================== HELPERS ============================== */

function dOnly(d) { return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime(); }

function nthWeekdayOfMonth(year, month, weekday, n) {
  let d = new Date(year, month, 1);
  let count = 0;
  while (d.getMonth() === month) {
    if (d.getDay() === weekday) {
      count++;
      if (count === n) return new Date(d);
    }
    d.setDate(d.getDate() + 1);
  }
  return null;
}

function lastWeekdayOfMonth(year, month, weekday) {
  let d = new Date(year, month + 1, 0);
  while (d.getDay() !== weekday) d.setDate(d.getDate() - 1);
  return new Date(d);
}

function occurrenceInMonth(entry, year, month) {
  const wd = WEEKDAYS.indexOf(entry.weekday);
  if (entry.week === "ultimo") return lastWeekdayOfMonth(year, month, wd);
  return nthWeekdayOfMonth(year, month, wd, parseInt(entry.week, 10));
}

function nextOccurrence(entry, fromDate, strictlyAfter) {
  let y = fromDate.getFullYear(), m = fromDate.getMonth();
  const fromT = dOnly(fromDate);
  for (let i = 0; i < 15; i++) {
    const d = occurrenceInMonth(entry, y, m);
    if (d) {
      const t = dOnly(d);
      if (strictlyAfter ? t > fromT : t >= fromT) return d;
    }
    m++; if (m > 11) { m = 0; y++; }
  }
  return null;
}

function fmtDateShort(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "short" }).replace(".", "");
}
function fmtDateFull(d) {
  return d.toLocaleDateString("pt-BR", { day: "2-digit", month: "long", year: "numeric" });
}
function todayKey(d) { return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; }

function wazeSearchUrl(house, override) {
  if (override && override.confirmado && override.lat && override.lng) {
    return `https://waze.com/ul?ll=${override.lat}%2C${override.lng}&navigate=yes`;
  }
  if (override && override.confirmado && override.endereco) {
    return `https://waze.com/ul?q=${encodeURIComponent(override.endereco + ", São Paulo")}&navigate=yes`;
  }
  return `https://waze.com/ul?q=${encodeURIComponent(house.name + " Setor Jaraguá São Paulo")}`;
}

function shareText(house, entry, date) {

}

async function doShare(text, title) {
  if (navigator.share) {
    try { await navigator.share({ title, text }); return; } catch (e) { /* cancelled */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    alert("Texto copiado! Cole no WhatsApp para compartilhar.");
  } catch (e) {
    window.open(`https://wa.me/?text=${encodeURIComponent(text)}`, "_blank");
  }
}

/* ============================== STORAGE HOOK ============================== */

function useStored(key, initial /*, shared - ignored in single-file version, always local */) {
  const [value, setValue] = useState(initial);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    try {
      const raw = window.localStorage.getItem(key);
      if (raw) setValue(JSON.parse(raw));
    } catch (e) { /* keep initial */ }
    setReady(true);
  }, [key]);

  const save = (next) => {
    setValue(next);
    try { window.localStorage.setItem(key, JSON.stringify(next)); }
    catch (e) { console.error("storage set failed", e); }
  };
  return [value, save, ready];
}

function HomePage({ favorites, toggleFav, casasOverrides, ensaiosOverrides, avisos, openHouse, setView }) {
  const today = useMemo(() => new Date(), []);
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);

  const todays = useMemo(() => {
    return scheduleMerged.filter(e => {
      const d = occurrenceInMonth(e, today.getFullYear(), today.getMonth());
      return d && dOnly(d) === dOnly(today);
    });
  }, [scheduleMerged, today]);

  const upcoming = useMemo(() => {
    const list = scheduleMerged.map(e => ({ entry: e, date: nextOccurrence(e, today, true) })).filter(x => x.date);
    list.sort((a, b) => a.date - b.date);
    return list.slice(0, 8);
  }, [scheduleMerged, today]);

  const activeAvisos = useMemo(() => {
    const t = dOnly(today);
    return avisos.filter(a => {
      const s = a.startDate ? dOnly(new Date(a.startDate + "T00:00:00")) : -Infinity;
      const e = a.endDate ? dOnly(new Date(a.endDate + "T00:00:00")) : Infinity;
      return t >= s && t <= e;
    });
  }, [avisos, today]);

  const AVISO_ICON = { cancelamento: "🔴", alteracao: "🟡", informacao: "🔵", novidade: "🟢" };

  const weekdayName = WD_LABEL[WEEKDAYS[today.getDay()]];

  return (
    <div className="px-4 pt-4 pb-6 space-y-6">
      {activeAvisos.length > 0 && (
        <div className="space-y-2">
          {activeAvisos.map(a => (
            <div key={a.id} className="rounded-xl bg-white border border-slate-200 p-3 flex gap-2 items-start shadow-sm">
              <span className="text-lg leading-none">{AVISO_ICON[a.type] || "🔵"}</span>
              <div className="min-w-0">
                <p className="font-semibold text-sm text-slate-900">{a.title}</p>
                <p className="text-xs text-slate-500">{a.message}</p>
              </div>
            </div>
          ))}
        </div>
      )}

      <div>
        <SectionTitle icon={Sparkles} accent="bg-amber-500">🔥 Ensaios de Hoje</SectionTitle>
        <p className="text-sm text-slate-500 -mt-2 mb-3">Hoje — {weekdayName}, {fmtDateShort(today)} · {todays.length} ensaio{todays.length !== 1 ? "s" : ""} encontrado{todays.length !== 1 ? "s" : ""}</p>
        {todays.length === 0 ? (
          <EmptyState icon={Music} title="Nenhum ensaio hoje" subtitle="Veja os próximos ensaios abaixo." />
        ) : (
          <div className="space-y-2.5">
            {todays.map(e => {
              const house = HOUSES.find(h => h.id === e.houseId);
              return <EnsaioCard key={e.id} house={house} entry={e} date={today} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />;
            })}
          </div>
        )}
      </div>

      <div>
        <SectionTitle icon={CalendarIcon}>📅 Próximos Ensaios</SectionTitle>
        <div className="space-y-2.5">
          {upcoming.map(({ entry, date }) => {
            const house = HOUSES.find(h => h.id === entry.houseId);
            return <EnsaioCard key={entry.id} house={house} entry={entry} date={date} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />;
          })}
        </div>
        <button onClick={() => setView("calendario")} className="mt-3 text-sm text-blue-700 font-semibold w-full text-center">Ver calendário completo →</button>
      </div>
    </div>
  );
}

/* ============================== CALENDARIO PAGE ============================== */

function CalendarioPage({ ensaiosOverrides, favorites, toggleFav, casasOverrides, openHouse }) {
  const [cursor, setCursor] = useState(() => { const d = new Date(); return new Date(d.getFullYear(), d.getMonth(), 1); });
  const [selDay, setSelDay] = useState(new Date());
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);

  const year = cursor.getFullYear(), month = cursor.getMonth();
  const monthEvents = useMemo(() => {
    const map = {};
    scheduleMerged.forEach(e => {
      const d = occurrenceInMonth(e, year, month);
      if (d) {
        const k = d.getDate();
        if (!map[k]) map[k] = [];
        map[k].push(e);
      }
    });
    return map;
  }, [scheduleMerged, year, month]);

  const firstDow = new Date(year, month, 1).getDay();
  const daysInMonth = new Date(year, month + 1, 0).getDate();
  const cells = [];
  for (let i = 0; i < firstDow; i++) cells.push(null);
  for (let d = 1; d <= daysInMonth; d++) cells.push(d);

  const selEvents = selDay.getMonth() === month && selDay.getFullYear() === year ? (monthEvents[selDay.getDate()] || []) : [];
  const today = new Date();

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={CalendarIcon}>Calendário</SectionTitle>
      <div className="bg-white rounded-2xl border border-slate-200 p-3 shadow-sm">
        <div className="flex items-center justify-between mb-3">
          <button onClick={() => setCursor(new Date(year, month - 1, 1))} className="p-2 rounded-full bg-slate-100"><ChevronLeft size={18} /></button>
          <p className="font-serif font-semibold text-slate-900 capitalize">{cursor.toLocaleDateString("pt-BR", { month: "long", year: "numeric" })}</p>
          <button onClick={() => setCursor(new Date(year, month + 1, 1))} className="p-2 rounded-full bg-slate-100"><ChevronRight size={18} /></button>
        </div>
        <button onClick={() => { setCursor(new Date(today.getFullYear(), today.getMonth(), 1)); setSelDay(today); }} className="text-xs text-blue-700 font-semibold mb-2">Hoje</button>
        <div className="grid grid-cols-7 text-center text-[11px] font-semibold text-slate-400 mb-1">
          {["D","S","T","Q","Q","S","S"].map((d,i) => <div key={i}>{d}</div>)}
        </div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const evs = monthEvents[d] || [];
            const isToday = dOnly(new Date(year, month, d)) === dOnly(today);
            const isSel = selDay.getDate() === d && selDay.getMonth() === month && selDay.getFullYear() === year;
            return (
              <button key={i} onClick={() => setSelDay(new Date(year, month, d))}
                className={`aspect-square rounded-lg flex flex-col items-center justify-center text-sm relative
                  ${isSel ? "bg-blue-700 text-white font-bold" : isToday ? "bg-amber-100 text-blue-900 font-bold" : "text-slate-700 hover:bg-slate-50"}`}>
                {d}
                {evs.length > 0 && (
                  <div className="flex gap-0.5 mt-0.5">
                    {evs.slice(0, 3).map((e, j) => <span key={j} className={`w-1.5 h-1.5 rounded-full ${isSel ? "bg-white" : WD_STYLE[e.weekday].dot}`} />)}
                  </div>
                )}
              </button>
            );
          })}
        </div>
      </div>

      <div className="mt-5">
        <p className="font-semibold text-slate-800 mb-2">{fmtDateFull(selDay)}</p>
        {selEvents.length === 0 ? (
          <EmptyState icon={CalendarIcon} title="Sem ensaios neste dia" />
        ) : (
          <div className="space-y-2.5">
            {selEvents.map(e => {
              const house = HOUSES.find(h => h.id === e.houseId);
              return <EnsaioCard key={e.id} house={house} entry={e} date={selDay} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />;
            })}
          </div>
        )}
      </div>
    </div>
  );
}

/* ============================== CASAS PAGE ============================== */

function CasasPage({ favorites, toggleFav, casasOverrides, ensaiosOverrides, openHouse }) {
  const [q, setQ] = useState("");
  const [showFilters, setShowFilters] = useState(false);
  const [fWeekday, setFWeekday] = useState("");
  const [fWeek, setFWeek] = useState("");
  const [fTime, setFTime] = useState("");
  const [onlyFav, setOnlyFav] = useState(false);

  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);

  const rows = useMemo(() => {
    return HOUSES.map(h => ({ house: h, entry: scheduleMerged.find(e => e.houseId === h.id) })).filter(r => {
      const ov = casasOverrides[r.house.id];
      if (ov && ov.ativo === false) return false;
      if (onlyFav && !favorites.includes(r.house.id)) return false;
      if (fWeekday && (!r.entry || r.entry.weekday !== fWeekday)) return false;
      if (fWeek && (!r.entry || r.entry.week !== fWeek)) return false;
      if (fTime && (!r.entry || r.entry.time !== fTime)) return false;
      if (q.trim()) {
        const s = q.toLowerCase();
        const hay = [r.house.name, r.entry?.person, r.entry ? WD_LABEL[r.entry.weekday] : "", r.entry ? WEEK_LABEL[r.entry.week] : "", r.entry?.time].join(" ").toLowerCase();
        if (!hay.includes(s)) return false;
      }
      return true;
    });
  }, [q, fWeekday, fWeek, fTime, onlyFav, favorites, casasOverrides, scheduleMerged]);

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={MapPin}>Casas de Oração</SectionTitle>
      <div className="flex gap-2 mb-3">
        <div className="relative flex-1">
          <Search size={16} className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-400" />
          <input value={q} onChange={e => setQ(e.target.value)} placeholder="Buscar Casa, bairro, encarregado, horário..."
            className="w-full pl-9 pr-3 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-blue-700" />
        </div>
        <button onClick={() => setShowFilters(s => !s)} className={`p-2.5 rounded-xl border ${showFilters ? "bg-blue-700 text-white border-blue-700" : "bg-white text-slate-600 border-slate-200"}`}><Filter size={18} /></button>
      </div>

      {showFilters && (
        <div className="bg-slate-50 rounded-xl p-3 mb-3 space-y-3 border border-slate-200">
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Dia</p>
            <div className="flex gap-1.5 flex-wrap">
              {["sexta","sabado","domingo"].map(w => (
                <button key={w} onClick={() => setFWeekday(fWeekday === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fWeekday === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{WD_LABEL[w]}</button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Semana</p>
            <div className="flex gap-1.5 flex-wrap">
              {["1","2","3","4","ultimo"].map(w => (
                <button key={w} onClick={() => setFWeek(fWeek === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fWeek === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{WEEK_LABEL[w]}</button>
              ))}
            </div>
          </div>
          <div>
            <p className="text-xs font-semibold text-slate-500 mb-1.5 uppercase">Horário</p>
            <div className="flex gap-1.5 flex-wrap">
              {["16:00","16:30","17:00","19:30"].map(w => (
                <button key={w} onClick={() => setFTime(fTime === w ? "" : w)}
                  className={`px-3 py-1.5 rounded-full text-xs font-semibold ${fTime === w ? "bg-blue-700 text-white" : "bg-white text-slate-600 border border-slate-200"}`}>{w}</button>
              ))}
            </div>
          </div>
          <label className="flex items-center gap-2 text-sm font-medium text-slate-700">
            <input type="checkbox" checked={onlyFav} onChange={e => setOnlyFav(e.target.checked)} className="w-4 h-4 accent-blue-700" /> Somente favoritos
          </label>
        </div>
      )}

      <p className="text-xs text-slate-400 mb-2">{rows.length} de {HOUSES.length} Casas</p>
      <div className="space-y-2.5">
        {rows.length === 0 && <EmptyState icon={Search} title="Nenhuma Casa encontrada" subtitle="Tente outro termo ou remova os filtros." />}
        {rows.map(({ house, entry }) => entry && (
          <EnsaioCard key={house.id} house={house} entry={entry} date={null} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[house.id]} onOpen={openHouse} />
        ))}
      </div>
    </div>
  );
}

function CasaDetailPage({ houseId, favorites, toggleFav, casasOverrides, ensaiosOverrides, back }) {
  const house = HOUSES.find(h => h.id === houseId);
  const ov = casasOverrides[houseId] || {};
  const entry = useMemo(() => {
    const base = SCHEDULE.find(e => e.houseId === houseId);
    return base ? { ...base, ...(ensaiosOverrides[base.id] || {}) } : null;
  }, [houseId, ensaiosOverrides]);
  const isFav = favorites.includes(houseId);

  const nextDates = useMemo(() => {
    if (!entry) return [];
    const list = [];
    let from = new Date();
    for (let i = 0; i < 4; i++) {
      const d = nextOccurrence(entry, from, i > 0);
      if (!d) break;
      list.push(d);
      from = new Date(d.getTime() + 86400000);
    }
    return list;
  }, [entry]);

  if (!house) return null;

  return (
    <div className="pb-6">
      <div className="relative">
        <HousePhoto url={ov.photo} className="w-full h-56" />
        <button onClick={back} className="absolute top-4 left-4 p-2 rounded-full bg-black/40 text-white backdrop-blur"><ArrowLeft size={20} /></button>
        <div className="absolute top-4 right-4"><FavButton active={isFav} onToggle={() => toggleFav(houseId)} size={20} /></div>
      </div>
      <div className="px-4 pt-4 space-y-5">
        <h1 className="font-serif text-2xl font-bold text-slate-900">{house.name}</h1>

        {entry && (
          <div className={`rounded-2xl p-4 border ${WD_STYLE[entry.weekday].border} ${WD_STYLE[entry.weekday].bg}`}>
            <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2">Próximo ensaio</p>
            <div className="grid grid-cols-3 gap-2 text-center">
              <div>
                <CalendarIcon size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800">{WEEK_LABEL[entry.week]} {WD_SHORT[entry.weekday]}</p>
              </div>
              <div>
                <Clock size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800">{entry.time}</p>
              </div>
              <div>
                <User size={18} className="mx-auto text-slate-500 mb-1" />
                <p className="text-sm font-bold text-slate-800 truncate">{entry.person}</p>
              </div>
            </div>
            <div className="flex gap-2 mt-3">
              <IconBtn icon={Share2} label="Compartilhar" tone="slate" onClick={() => doShare(shareText(house, entry, nextDates[0]), "Calendário Musical")} />
            </div>
          </div>
        )}

        <div>
          <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2 flex items-center gap-1.5"><MapPin size={13} /> Localização</p>
          {ov.confirmado ? (
            <div className="rounded-xl border border-slate-200 p-3">
              <p className="text-sm text-slate-700">{ov.endereco}</p>
              {ov.bairro && <p className="text-xs text-slate-400 mt-0.5">{ov.bairro}{ov.cidade ? " · " + ov.cidade : ""}</p>}
            </div>
          ) : (
            <div className="rounded-xl border border-dashed border-slate-300 p-3 flex items-center gap-2 text-slate-500 text-sm">
              <AlertCircle size={16} className="shrink-0" /> Endereço em confirmação — informação em atualização.
            </div>
          )}
          <div className="grid grid-cols-2 gap-2 mt-3">
            <a href={wazeSearchUrl(house, ov)} target="_blank" rel="noreferrer"
              className="flex items-center justify-center gap-2 bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm"><Navigation size={17} /> {ov.confirmado ? "Abrir no Waze" : "Pesquisar no Waze"}</a>
            <button className="flex items-center justify-center gap-2 bg-slate-100 text-slate-600 font-semibold py-3 rounded-xl text-sm"><MapPin size={17} /> Ver no mapa</button>
          </div>
        </div>

        <div>
          <p className="text-xs font-bold uppercase tracking-wide text-slate-500 mb-2 flex items-center gap-1.5"><CalendarIcon size={13} /> Calendário</p>
          <div className="space-y-2">
            {nextDates.map((d, i) => (
              <div key={i} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                <span className="text-sm font-medium text-slate-700">{fmtDateFull(d)}</span>
                <span className="text-sm font-bold text-blue-700">{entry.time}</span>
              </div>
            ))}
          </div>
        </div>
      </div>
    </div>
  );
}

function FavoritosPage({ favorites, toggleFav, casasOverrides, ensaiosOverrides, openHouse, setView }) {

  const favEntries = useMemo(() => {
    const list = favorites.map(hid => {
      const entry = scheduleMerged.find(e => e.houseId === hid);
      if (!entry) return null;
      return { house: HOUSES.find(h => h.id === hid), entry, date: nextOccurrence(entry, new Date(), false) };
    }).filter(Boolean);
    list.sort((a, b) => a.date - b.date);
    return list;

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={Heart} accent="bg-rose-500">❤️ Meus Favoritos</SectionTitle>

        <EmptyState icon={Heart} title="Você ainda não tem favoritos" subtitle="Toque no coração de uma Casa para adicioná-la aqui." />

        <>
          <div className="bg-rose-50 border border-rose-100 rounded-xl p-3 mb-4">
            <p className="text-xs font-bold uppercase text-rose-500 mb-1.5">Próximo ensaio dos seus favoritos</p>
            {favEntries.slice(0, 3).map(f => (
              <p key={f.house.id} className="text-sm text-slate-700"><span className="font-semibold">{f.house.name}</span> — {WD_LABEL[f.entry.weekday]} • {f.entry.time}</p>
            ))}
          </div>
          <div className="space-y-2.5">
            {favEntries.map(f => (
              <EnsaioCard key={f.house.id} house={f.house} entry={f.entry} date={f.date} favorites={favorites} toggleFav={toggleFav} casaOverride={casasOverrides[f.house.id]} onOpen={openHouse} />

}

/* ============================== MINHA AGENDA ============================== */

function AgendaPage({ favorites, ensaiosOverrides, casasOverrides, favToggle, openHouse }) {
  const scheduleMerged = useMemo(() => SCHEDULE.map(e => ({ ...e, ...(ensaiosOverrides[e.id] || {}) })), [ensaiosOverrides]);
  const grouped = useMemo(() => {
    const g = { sexta: [], sabado: [], domingo: [] };
    favorites.forEach(hid => {
      const entry = scheduleMerged.find(e => e.houseId === hid);
      if (entry) g[entry.weekday].push({ house: HOUSES.find(h => h.id === hid), entry });
    });
    Object.keys(g).forEach(k => g[k].sort((a, b) => a.entry.time.localeCompare(b.entry.time)));
    return g;
  }, [favorites, scheduleMerged]);

  const order = ["sexta", "sabado", "domingo"];
  const any = favorites.length > 0;

  return (
    <div className="px-4 pt-4 pb-6">
      <SectionTitle icon={CalendarPlus} accent="bg-emerald-600">❤️ Minha Agenda</SectionTitle>
      {!any ? (
        <EmptyState icon={CalendarPlus} title="Adicione favoritos para montar sua agenda" />
      ) : (
        <div className="space-y-5">
          {order.filter(k => grouped[k].length).map(k => (
            <div key={k}>
              <p className={`font-serif font-bold text-sm uppercase tracking-wide mb-2 ${WD_STYLE[k].text}`}>{WD_LABEL[k]}</p>
              <div className="space-y-2">
                {grouped[k].map(({ house, entry }) => (
                  <button key={house.id} onClick={() => openHouse(house.id)} className={`w-full flex items-center justify-between rounded-xl border ${WD_STYLE[k].border} ${WD_STYLE[k].bg} px-3.5 py-2.5`}>
                    <span className="text-sm font-semibold text-slate-800">{entry.time} — {house.name}</span>
                    <ChevronRight size={16} className="text-slate-400" />
                  </button>
                ))}
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function AdminPage({ casasOverrides, saveCasasOverrides, ensaiosOverrides, saveEnsaiosOverrides, suggestions, saveSuggestions, avisos, saveAvisos, novidades, saveNovidades, historico, saveHistorico, favorites }) {
  const [authed, setAuthed] = useState(false);
  const [pwd, setPwd] = useState("");
  const [err, setErr] = useState("");
  const [tab, setTab] = useState("dashboard");
  const [editHouse, setEditHouse] = useState(null);
  const [editEntry, setEditEntry] = useState(null);
  const [avisoForm, setAvisoForm] = useState(null);

  const login = () => {
    if (pwd === ADMIN_PASSWORD) { setAuthed(true); setErr(""); }
    else setErr("Senha incorreta.");
  };

  const logHist = (houseName, field, oldV, newV) => {
    const entry = { id: "h_" + Date.now() + Math.random().toString(36).slice(2, 6), date: new Date().toISOString(), houseName, field, oldValue: String(oldV ?? "—"), newValue: String(newV ?? "—") };
    saveHistorico([entry, ...historico]);
  };

  if (!authed) {
    return (

        </div>
        <Field label="Senha de administrador">

      </div>
      <div className="flex gap-1.5 px-4 pb-3 overflow-x-auto no-scrollbar">
        {tabs.map(t => (
          <button key={t.id} onClick={() => setTab(t.id)} className={`px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap ${tab === t.id ? "bg-blue-700 text-white" : "bg-slate-100 text-slate-600"}`}>{t.label}</button>
        ))}
      </div>

      <div className="px-4">
        {tab === "dashboard" && (
          <div className="grid grid-cols-2 gap-3">
            {[
              ["Casas cadastradas", HOUSES.length],
              ["Ensaios cadastrados", SCHEDULE.length],
              ["Favoritos (este dispositivo)", favorites.length],
              ["Sugestões pendentes", pendingSug.length],
              ["Avisos ativos", avisos.length],
              ["Registros no histórico", historico.length],
            ].map(([label, val]) => (
              <div key={label} className="rounded-xl border border-slate-200 p-3.5">
                <p className="text-2xl font-bold text-blue-950">{val}</p>
                <p className="text-xs text-slate-500 mt-0.5">{label}</p>
              </div>
            ))}
          </div>
        )}

        {tab === "casas" && (
          <div className="space-y-2">
            {HOUSES.map(h => {

                  <div className="min-w-0">
                    <p className="text-sm font-semibold text-slate-800 truncate">{h.name}</p>
                    <p className="text-xs text-slate-400">{ov.confirmado ? "Endereço confirmado" : "Endereço em confirmação"} {ov.ativo === false ? "· Inativa" : ""}</p>
                  </div>
                  <button onClick={() => setEditHouse(h.id)} className="p-2 rounded-full bg-slate-100 text-slate-600 shrink-0"><Pencil size={15} /></button>
                </div>
              );
            })}
          </div>
        )}

        {tab === "ensaios" && (
          <div className="space-y-2">
            {scheduleMerged.map(e => {
              const h = HOUSES.find(hh => hh.id === e.houseId);
              return (
                <div key={e.id} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                  <div className="min-w-0">
                    <p className="text-sm font-semibold text-slate-800 truncate">{h.name}</p>

                  </div>
                  <button onClick={() => setEditEntry(e.id)} className="p-2 rounded-full bg-slate-100 text-slate-600 shrink-0"><Pencil size={15} /></button>
                </div>
              );

        {tab === "sugestoes" && (
          <div className="space-y-2.5">
            {suggestions.length === 0 && <EmptyState icon={Lightbulb} title="Nenhuma sugestão recebida" />}

              const h = HOUSES.find(hh => hh.id === s.casaId);
              return (
                <div key={s.id} className="rounded-xl border border-slate-200 p-3.5">
                  <div className="flex items-center justify-between mb-1">
                    <p className="text-sm font-bold text-slate-800">{h?.name}</p>
                    <span className={`text-[10px] font-bold uppercase px-2 py-0.5 rounded-full ${s.status === "pendente" ? "bg-amber-100 text-amber-700" : s.status === "aprovada" ? "bg-emerald-100 text-emerald-700" : "bg-slate-100 text-slate-500"}`}>{s.status}</span>
                  </div>
                  {s.type === "alteracao" ? (
                    <p className="text-sm text-slate-600">Alteração ({s.tipo}): {s.info}</p>
                  ) : (
                    <p className="text-sm text-slate-600">Novo ensaio: {s.data} às {s.horario} — {s.encarregado}</p>
                  )}
                  {s.obs && <p className="text-xs text-slate-400 mt-1">Obs: {s.obs}</p>}
                  {s.status === "pendente" && (
                    <div className="flex gap-2 mt-2.5">
                      <button onClick={() => {
                        saveSuggestions(suggestions.map(x => x.id === s.id ? { ...x, status: "aprovada" } : x));
                        saveNovidades([{ id: "n_" + Date.now(), date: new Date().toISOString().slice(0, 10), text: `Sugestão aprovada para ${h?.name}.` }, ...novidades]);
                        logHist(h?.name, "sugestão", "pendente", "aprovada");
                      }} className="flex-1 py-2 rounded-lg bg-emerald-600 text-white text-xs font-bold flex items-center justify-center gap-1"><Check size={13} /> Aprovar</button>
                      <button onClick={() => { saveSuggestions(suggestions.map(x => x.id === s.id ? { ...x, status: "recusada" } : x)); logHist(h?.name, "sugestão", "pendente", "recusada"); }}
                        className="flex-1 py-2 rounded-lg bg-slate-100 text-slate-600 text-xs font-bold flex items-center justify-center gap-1"><X size={13} /> Recusar</button>
                    </div>
                  )}
                </div>
              );
            })}
          </div>
        )}

        {tab === "avisos" && (
          <div>
            <button onClick={() => setAvisoForm({ id: "av_" + Date.now(), title: "", message: "", type: "informacao", startDate: "", endDate: "" })}
              className="w-full py-2.5 rounded-xl bg-blue-700 text-white text-sm font-semibold mb-3 flex items-center justify-center gap-1.5"><Plus size={15} /> Novo aviso</button>
            <div className="space-y-2">
              {avisos.map(a => (
                <div key={a.id} className="flex items-center justify-between rounded-xl border border-slate-200 p-3">
                  <div className="min-w-0">
                    <p className="text-sm font-semibold text-slate-800 truncate">{a.title}</p>
                    <p className="text-xs text-slate-400 truncate">{a.message}</p>
                  </div>
                  <div className="flex gap-1 shrink-0">
                    <button onClick={() => setAvisoForm(a)} className="p-2 rounded-full bg-slate-100 text-slate-600"><Pencil size={14} /></button>
                    <button onClick={() => saveAvisos(avisos.filter(x => x.id !== a.id))} className="p-2 rounded-full bg-rose-50 text-rose-500"><Trash2 size={14} /></button>
                  </div>
                </div>
              ))}
            </div>
          </div>
        )}

        {tab === "historico" && (
          <div className="space-y-2.5">
            {historico.length === 0 && <EmptyState icon={Clock} title="Nenhuma alteração registrada ainda" />}
            {historico.map(h => (
              <div key={h.id} className="rounded-xl border border-slate-200 p-3 text-sm">
                <p className="text-xs text-slate-400">{new Date(h.date).toLocaleString("pt-BR")}</p>
                <p className="font-semibold text-slate-800">{h.houseName} — {h.field}</p>
                <p className="text-slate-500 text-xs">{h.oldValue} → <span className="font-semibold text-slate-700">{h.newValue}</span></p>
              </div>
            ))}
          </div>
        )}
      </div>

      {editHouse && (
        <EditHouseModal
          houseId={editHouse}
          data={casasOverrides[editHouse] || {}}
          onClose={() => setEditHouse(null)}
          onSave={(data) => {
            const h = HOUSES.find(x => x.id === editHouse);
            logHist(h.name, "dados da casa", "—", "atualizado");
            saveCasasOverrides({ ...casasOverrides, [editHouse]: data });
            setEditHouse(null);
          }}
        />
      )}

      {editEntry && (
        <EditEntryModal
          entry={scheduleMerged.find(e => e.id === editEntry)}
          onClose={() => setEditEntry(null)}
          onSave={(data) => {
            const base = SCHEDULE.find(e => e.id === editEntry);
            const h = HOUSES.find(x => x.id === base.houseId);
            logHist(h.name, "horário", base.time, data.time);
            saveEnsaiosOverrides({ ...ensaiosOverrides, [editEntry]: data });
            setEditEntry(null);
          }}
        />
      )}

      {avisoForm && (
        <AvisoModal
          data={avisoForm}
          onClose={() => setAvisoForm(null)}
          onSave={(data) => {
            const exists = avisos.find(a => a.id === data.id);
            saveAvisos(exists ? avisos.map(a => a.id === data.id ? data : a) : [data, ...avisos]);
            setAvisoForm(null);
          }}
        />
      )}
    </div>
  );
}

  const [houseId, setHouseId] = useState(null);
  const [moreOpen, setMoreOpen] = useState(false);

  const [favorites, saveFavorites, favReady] = useStored("favorites", [], false);
  const [casasOverrides, saveCasasOverrides] = useStored("casas-overrides", {}, true);
  const [ensaiosOverrides, saveEnsaiosOverrides] = useStored("ensaios-overrides", {}, true);
  const [suggestions, saveSuggestions] = useStored("suggestions", [], true);
  const [avisos, saveAvisos] = useStored("avisos", [], true);
  const [novidades, saveNovidades] = useStored("novidades", SEED_NOVIDADES, true);
  const [historico, saveHistorico] = useStored("historico", [], true);

  const toggleFav = (hid) => {
    saveFavorites(favorites.includes(hid) ? favorites.filter(x => x !== hid) : [...favorites, hid]);
  };
  const openHouse = (hid) => { setHouseId(hid); setView("casa-detail"); };
  const addSuggestion = (s) => saveSuggestions([...suggestions, s]);

  useEffect(() => { window.scrollTo(0, 0); }, [view, houseId]);

  let content;
  if (!favReady) {
    content = <div className="px-4 pt-16 text-center text-slate-400 text-sm">Carregando...</div>;
  } else if (view === "home") content = <HomePage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} avisos={avisos} openHouse={openHouse} setView={setView} />;
  else if (view === "calendario") content = <CalendarioPage ensaiosOverrides={ensaiosOverrides} favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} openHouse={openHouse} />;
  else if (view === "casas") content = <CasasPage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} openHouse={openHouse} />;
  else if (view === "casa-detail") content = <CasaDetailPage houseId={houseId} favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} back={() => setView("casas")} />;
  else if (view === "favoritos") content = <FavoritosPage favorites={favorites} toggleFav={toggleFav} casasOverrides={casasOverrides} ensaiosOverrides={ensaiosOverrides} openHouse={openHouse} setView={setView} />;
  else if (view === "agenda") content = <AgendaPage favorites={favorites} ensaiosOverrides={ensaiosOverrides} casasOverrides={casasOverrides} favToggle={toggleFav} openHouse={openHouse} />;
  else if (view === "mapa") content = <MapaPage casasOverrides={casasOverrides} favorites={favorites} toggleFav={toggleFav} openHouse={openHouse} />;
  else if (view === "novidades") content = <NovidadesPage novidades={novidades} />;
  else if (view === "avisos") content = <AvisosPage avisos={avisos} />;
  else if (view === "sugerir-alt") content = <SugerirAlteracaoPage addSuggestion={addSuggestion} setView={setView} />;
  else if (view === "sugerir-ensaio") content = <SugerirEnsaioPage addSuggestion={addSuggestion} setView={setView} />;
  else if (view === "config") content = <ConfiguracoesPage setView={setView} />;
  else if (view === "admin") content = <AdminPage casasOverrides={casasOverrides} saveCasasOverrides={saveCasasOverrides} ensaiosOverrides={ensaiosOverrides} saveEnsaiosOverrides={saveEnsaiosOverrides}
    suggestions={suggestions} saveSuggestions={saveSuggestions} avisos={avisos} saveAvisos={saveAvisos} novidades={novidades} saveNovidades={saveNovidades}
    historico={historico} saveHistorico={saveHistorico} favorites={favorites} />;

  return (
    <div className="min-h-screen bg-slate-50 font-sans max-w-md mx-auto relative pb-16 shadow-xl">
      {view !== "casa-detail" && <Header onMenu={() => setMoreOpen(true)} />}
      <main>{content}</main>
      <BottomNav view={view} setView={(v) => { setHouseId(null); setView(v); }} favCount={favorites.length} />
      {moreOpen && <MoreSheet onClose={() => setMoreOpen(false)} setView={setView} />}
    </div>
  );
}

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
